databases:
  - name: kaduna-transcript-db
    plan: free
    region: frankfurt
    databaseName: kaduna_transcript
    user: kaduna_transcript
    ipAllowList: [] # internal connections only

services:
  - type: web
    name: kaduna-transcript
    runtime: docker
    plan: free
    region: frankfurt # must match the database region
    healthCheckPath: /up # Laravel's built-in health route
    envVars:
      # App
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # paste "base64:..." in the dashboard
      - key: APP_URL
        sync: false # e.g. https://kaduna-transcript.onrender.com
      - key: LOG_CHANNEL
        value: stderr

      # Database (Render injects the internal connection string)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: kaduna-transcript-db
          property: connectionString

      # Drivers already used by the app
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Mail (use port 2525 or an HTTP API; free services block 25, 465, 587)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

      # Paystack
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

      # First super admin (created only if it does not exist yet)
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false